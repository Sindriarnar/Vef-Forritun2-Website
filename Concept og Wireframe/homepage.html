const offers=[{title:'Hamborgaratilboð',sub:'Borgari, franskar og gos',sale:'50%',art:burger,place:'Borgarabarinn',price:'1.990 kr.',desc:'Hamborgari með frönskum og gosdrykk. Tilboð dagsins frá kl. 12:00 til 21:00.'},{title:'Pítsa fyrir tvo',sub:'Tvær pítsur á góðu verði',sale:'30%',art:pizza,place:'Hornpítsan',price:'3.490 kr.',desc:'Tvær nýbakaðar pítsur til að deila. Tilboðið gildir í dag frá kl. 16:00 til 22:00.'},{title:'Bíókvöld',sub:'Stóra tjaldið bíður',sale:'25%',art:cinema,place:'Bæjarbíó',price:'1.490 kr.',desc:'Finndu góða mynd og njóttu kvöldsins. Sýningar í kvöld kl. 18:00 og 20:30.'}];let slide=0;
function selectSlide(n){slide=n;const o=offers[n];$('#burger-art').innerHTML=o.art;$('#offer-title').textContent=o.title;$('#offer-sub').textContent=o.sub;$('#sale-text').textContent=o.sale;$('.sale').setAttribute('aria-label',o.sale+' afsláttur');$('#featured').setAttribute('aria-label','Skoða '+o.title);document.querySelectorAll('.dot').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.slide===n)))}
function showTab(events){$('#feed').hidden=events;$('#events').hidden=!events;$('#for-you').setAttribute('aria-selected',String(!events));$('#events-tab').setAttribute('aria-selected',String(events));$('#for-you').tabIndex=events?-1:0;$('#events-tab').tabIndex=events?0:-1}
function detail(){const o=offers[slide];$('#detail-title').textContent=o.title;$('#detail-body').innerHTML=`<div class="detail-image">${o.art}</div><p>${o.desc}</p><div class="facts"><strong>${o.place}</strong><br>${o.price}</div><button class="action" id="booking">Skoða tilboð ↗</button><p class="notice" id="booking-note" role="status">Sýnigögn · engin raunveruleg bókun.</p>`;$('#details').showModal();$('#booking').onclick=()=>$('#booking-note').textContent='Hér myndi bókunarsíða seljanda opnast í fullbúinni útgáfu.'}
$('#featured').onclick=detail;$('#offer-info').onclick=detail;$('#menu-button').onclick=()=>$('#menu').showModal();$('#profile-button').onclick=()=>$('#profile').showModal();$('#for-you').onclick=()=>showTab(false);$('#events-tab').onclick=()=>showTab(true);$('#activity').onclick=()=>showTab(true);$('#brand').onclick=()=>{showTab(false);window.scrollTo(0,0)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>selectSlide(+b.dataset.slide));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{$('#menu').close();showTab(b.dataset.view==='events')});$('#random-choice').onclick=()=>{$('#menu').close();selectSlide(Math.floor(Math.random()*offers.length));detail()};
document.querySelectorAll('[role=tab]').forEach(b=>b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let events=e.key==='End'||(e.key!=='Home'&&b.id==='for-you');showTab(events);$(events?'#events-tab':'#for-you').focus()}});
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{$('#detail-title').textContent=+b.dataset.event===0?'Ice Guys í bíó':'Jólastemning í miðbænum';$('#detail-body').innerHTML='<p>Nánari upplýsingar um viðburð, staðsetningu og tíma myndu birtast hér.</p><p class="notice">Þessi viðburður er aðeins sýnidæmi.</p>';$('#details').showModal()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}));
let touchStart=null;$('#featured').addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});$('#featured').addEventListener('touchend',e=>{if(touchStart!==null&&Math.abs(e.changedTouches[0].clientX-touchStart)>45){selectSlide((slide+(e.changedTouches[0].clientX<touchStart?1:2))%3);e.preventDefault()}touchStart=null});selectSlide(0);
</script>
